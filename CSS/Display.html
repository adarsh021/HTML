    <!-- 
     Display property
       -> display property define the displaying beheviour of an html element.
       types:
          1. Block
          2. None
          3. Inline
          4. Inline block
          5. Flex
        
       1. Block:
          -> it is defult display for few eleemnt.
          -> Block element always consume hole width of window.
          -> Block element start with new line.
          -> Block elements accepts height and width.
          -> Example : - all heading tags, <div>, <li>, etc.. 
        
       2. None:
          -> Elimintes element completly from window layout.
          
       3. Inline:
           -> It is default for few html element .
           -> Display elements as inline i.e in same line side by side.
           -> Height and width won't have any effect. 

       4. Inline block:
           -> Makes element to be display in same line as inline-lavel.
           -> Elements accepts height and width. 
           
       5. Flex:
           -> Stands for flexible box.
           -> it makes an html element an inline-level block contains and create a relationship of parent and child parent element is called as flext-box and childern are called as flex-items.
           -> handle the child element in either one directional and one-dimensional either row or column wise.
           -> Mainaly used in managing space alingment of child element and it is most famously used for making web page as responsive.
           
           
    -->
     <style>
        h1{
            background-color: chartreuse;
            height: 100px;
            display: flex;
            /* text-align: center; */
            align-items: center;
            justify-content: center;
        }
