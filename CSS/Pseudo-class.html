    <!-- 
    
Pseudo-class
    -> it is one type of selector
    -> use to change the state of whole selected html
    -> It target html element based on link abailabel on web pages, user interaction , position of element on DOM.
    -> Syntax:
         selector: Psuedo-class{
              CSS Property
         }

    -> Types:
         1.link:- Changes the state of unvisited links availabel in web pages.
         2.visited:- Changes the state of visited link in web pages.
         3.active:- It shows the active state of an html element when user clicks on html element.
         4.hover:- Change the state of an element when user takes curseer over element.
         5.focus:- Used to change the state an input element when user clicks on it.
         6.first-child:- it is used to select the first element to the targeted element.
         7.last-child:- It is used to select the last element to the targeted element.
         8.nth-child:- It is used to select the nth element to the targeted element.
         9.checked:- Change the state when element chaked.
         10.has():- 
         11.not():- 
         12.root:- 
    
    -->
         <style>
            .links>a{
                text-decoration: none;
                font-size: 3rem;
                line-height: 80px;
            }
            .links>a:link{
                color: red;
            }
            .links>a:visited{
                color: green;
            }
            .links>a:active{
                color: yellow;
            }
            button{
                height: 65px;
                width: 300px;
                margin-left: 20%;
                /* background-color: linear-gradient(25deg, blueviolet, magenta); */
                background-color: red;
                border: none;
                border-radius: 10px;
                font-size: 1.2rem;
                font-weight: 600;
                outline: 3px white solid;
                outline-offset: -10px;
                color: white;
                transition: all 200ms linear;
            }
            button:active{
                transform: scale(0.95);
                
            }
            button:hover{
                outline: 3px color-mix(in srgb, blueviolet 50%, magenta 50%) solid;
                outline-offset: 7px;
            }
            .links>a:hover{
                color: blueviolet;
                font-size: 5rem;
                text-shadow: 5px 4px 0px black;
                font-weight: 400;
            }
         </style>
