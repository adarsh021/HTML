<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;

        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
         .wrapper{
            height: 100vh;
            width: 100%;
            /* background-color: grey; */
            display: flex; 
            justify-content: space-evenly;
            align-items: center;         
         }
         .wrapper .card1{
            height: 200px;
            width: 350px;
            border: 2px solid black;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 5px;            
         }
         .wrapper .card1 .circule{
            height: 110px;
            width: 110px;
            border-radius: 50%;
            border: 2px solid black;
            margin: 5px;
         }
         .wrapper .card1 .inner-card{
            height: 120px;
            width: 250px;
            border: 2px dotted black;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
         }
         .wrapper .card1 .inner-card h1{
            font-size: 1.3rem;
            
         }
         .wrapper .card1 .inner-card h3{
            font-size: 1.1rem;
            
         }
         .wrapper .card1 .inner-card p{
            font-size: 1rem;
         }
         .wrapper .card2{
            height: 300px;
            width: 300px;
            border: 2px solid black;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 5px;            
         }
         .wrapper .card2 .circule{
            height: 110px;
            width: 110px;
            border-radius: 50%;
            border: 2px solid black;
            margin: 5px;
         }
         .wrapper .card2 .inner-card{
            height: 120px;
            width: 250px;
            border: 2px dotted black;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
         }
         .wrapper .card2 .inner-card h1{
            font-size: 1.3rem;
            
         }
         .wrapper .card2 .inner-card h3{
            font-size: 1.1rem;
            
         }
         .wrapper .card2 .inner-card p{
            font-size: 1rem;
         }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card1">
            <div class="circule"></div>
            <div class="inner-card">
                <h1>Jspider BTM</h1>
                <h3>Bengaluru</h3>
                <p>Institute on java Development</p>
            </div>
        </div>
        <div class="card2">
            <div class="circule"></div>
            <div class="inner-card">
                <h1>Jspider</h1>
                <h3>Bengaluru</h3>
                <p>Institute on java Development</p>
            </div>
        </div>
    </div>
</body>
</html>
