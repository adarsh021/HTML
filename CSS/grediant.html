<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .wraper{
            height: 100vh;
            width: 100%;
        }
        .lg-1{
            background-image: linear-gradient(yellow 0px 300px, lime 400px , red);
            text-align: center;
        }
        .lg-2{
            background-image: linear-gradient(to top, cyan, indigo);
        }
        button{
            height: 70px;
            width: 300px;
            background-image: linear-gradient(cyan,indigo);
        }
    </style>
</head>
<body>
    <div class="wraper lg-1">
        <button><h1>Submit</h1></button>
    </div>
    <div class="wraper lg-2"></div>

</body>
</html>
