      <!-- 
      -> Insearting images
        * To insert image, use <img> tag.
        * It is a single tag, void element.
        * It is inline element
        * Used to insert static images.
        * Preferably .webp images should be used in web page
        * Syntax:
           <img src = "" alt="">
        * Attributes:
           1. Src - Source : Name/ Path/URL of the image
           2. alt - alternate: Describe the alternative name given to image to enhance screen readability. It work in the absense of source.
           3. height & width - px, %.
           4. title    
      
-->
     <picture>
  <source
    media="(max-width: 425px)"
    srcset="https://jlr.scene7.com/is/image/jlr/L46027GL_01_L4…_EXT_HERO_Front_3_4_9X16?wid=1280&fit=stretch%2C1"
  >

  <source
    media="(max-width: 768px)"
    srcset="https://jlr.scene7.com/is/image/jlr/L46027GL_303105263_066-1?wid=1300"
  >

  <source
    media="(max-width: 1024px)"
    srcset="https://jlr.scene7.com/is/image/jlr/L48128GL_303105691_012_TEASE?wid=740&fit=stretch%2C1"
  >

  <img
    src="https://jlr.scene7.com/is/image/jlr/L55124GL_303101952_014?wid=420&fit=stretch%2C1"
    alt=""
    width="100%"
  >
</picture>


     <!-- 
       * Picture 
        -> to insert responsive image according to the different devices <picture> tag will be used.
        -> It is paired tag, contains <source> that defines different sources to different devices.
        -> Syntax:
          <picture>
            <source media="" srcset="">
            <source media="" srcset="">
            <source media="" srcset="">
            <img src="" alt="">
          </picture>
     
     -->
